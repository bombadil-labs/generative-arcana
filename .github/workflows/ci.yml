name: Validate app and MCP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  app:
    name: App ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            command: npm test
          - check: typecheck
            command: npm run typecheck
          - check: build
            command: npm run build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run validation
        id: validation
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} 2>&1 | tee /tmp/validation.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Post typecheck diagnostics
        if: failure() && matrix.check == 'typecheck' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '### Strict TypeScript diagnostics'
            echo '```text'
            tail -c 12000 /tmp/validation.log
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/comment.md

  mcp:
    name: MCP typecheck + container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix mcp
      - run: npm run typecheck --prefix mcp
      - run: docker build -f mcp/Dockerfile -t generative-arcana-mcp:test .
