name: Validate app and MCP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app:
    name: App ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            command: npm test
          - check: typecheck
            command: npm run typecheck
          - check: build
            command: npm run build
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run validation
        run: ${{ matrix.command }}

  mcp:
    name: MCP ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: npm run typecheck --prefix mcp
          - check: stdio protocol
            command: npm run smoke:stdio --prefix mcp
          - check: HTTP protocol
            command: npm run smoke:http --prefix mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix mcp
      - name: Run validation
        run: ${{ matrix.command }}

  mcp-container:
    name: MCP container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f mcp/Dockerfile -t generative-arcana-mcp:test .
