name: Validate app and MCP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview-cleanup:
    name: Preview cleanup safety tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tools/test/preview-cleanup.test.mjs

  authoring-hosts:
    name: Authoring host wrappers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --test tools/test/smoke-production.test.mjs tools/test/prepare-production-auth.test.mjs
      - run: node tools/check-authoring-hosts.mjs
      - run: node --test tools/test/authoring-guide.test.mjs
      - run: node tools/build-authoring-guide.mjs && node tools/build-authoring-guide.mjs --check
      - run: node tools/audit-deck-v2.mjs --check --require-enriched=finalfantasy,deep-time,evolution,ultima,byrne,ulysses,ultima-octave

  app:
    name: App ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: tests
            command: npm test
          - check: typecheck
            command: npm run typecheck
          - check: build
            command: npm run build && node ../tools/check-public-distribution.mjs
          - check: public asset routes
            command: node --test tests/public-distribution.test.mjs
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Run validation
        run: ${{ matrix.command }}

  mcp:
    name: MCP ${{ matrix.check }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: typecheck
            command: npm run typecheck --prefix mcp
          - check: dependency security
            command: npm audit --prefix mcp --omit=dev --audit-level=high
          - check: host store
            command: npm run test:host-store --prefix mcp
          - check: durable state
            command: npm run test:durable-state --prefix mcp
          - check: retired bundled decks
            command: npm run test:retired-decks --prefix mcp
          - check: deck catalog
            command: npm run test:deck-catalog --prefix mcp
          - check: catalog freshness
            command: npm run test:catalog-freshness --prefix mcp
          - check: deployment readiness
            command: npm run test:deployment-readiness --prefix mcp
          - check: auth email configuration
            command: npm run test:auth-email --prefix mcp
          - check: Better Auth real protocol
            command: npm run test:better-auth --prefix mcp
          - check: Better Auth account ownership
            command: npm run test:better-auth-ownership --prefix mcp
          - check: domain migrations and shared rate limits
            command: npm run test:domain-migrations --prefix mcp
          - check: auth migration review guards
            command: npm run test:auth-schema --prefix mcp
          - check: staging read-only preflight
            command: npm run test:staging-preflight --prefix mcp
          - check: catalog tools
            command: npm run test:catalog-tools --prefix mcp
          - check: web catalog API
            command: npm run test:web-catalog-api --prefix mcp
          - check: browser session auth
            command: npm run test:browser-session --prefix mcp
          - check: cross-host account flow
            command: npm run test:cross-host-account --prefix mcp
          - check: complete authoring guide
            command: npm run test:authoring-guide --prefix mcp
          - check: authoring API
            command: npm run test:authoring-api --prefix mcp
          - check: Deep Time v2 render projection
            command: npm run test:deep-time-v2 --prefix mcp
          - check: Evolution v2 render projection
            command: npm run test:evolution-v2 --prefix mcp
          - check: Ultima v2 render projection
            command: npm run test:ultima-v2 --prefix mcp
          - check: Byrne v2 render projection
            command: npm run test:byrne-v2 --prefix mcp
          - check: Ulysses v2 render projection
            command: npm run test:ulysses-v2 --prefix mcp
          - check: Ultima Octave v2 render projection
            command: npm run test:ultima-octave-v2 --prefix mcp
          - check: web app static serving
            command: npm run test:web-app-static --prefix mcp
          - check: retired public assets
            command: npm run test:retired-assets --prefix mcp
          - check: shared decks
            command: npm run test:shared-decks --prefix mcp
          - check: principal resolver
            command: npm run test:principal --prefix mcp
          - check: alpha auth
            command: npm run test:alpha-auth --prefix mcp
          - check: HTTP lazy authorization
            command: npm run test:http-tool-auth --prefix mcp
          - check: OAuth identity
            command: npm run test:oauth-identity --prefix mcp
          - check: hardening
            command: npm run test:hardening --prefix mcp
          - check: efficient MCP transfers and edits
            command: npm run test:mcp-efficiency --prefix mcp
          - check: saved card artwork
            command: npm run test:card-artwork --prefix mcp
          - check: visual assets
            command: npm run test:visuals --prefix mcp
          - check: golden eval
            command: npm run eval:golden --prefix mcp
          - check: stdio protocol
            command: npm run smoke:stdio --prefix mcp
          - check: HTTP protocol
            command: npm run smoke:http --prefix mcp
          - check: authenticated HTTP persistence
            command: npm run smoke:http-auth --prefix mcp
          - check: HTTP guardrails
            command: npm run smoke:http-guardrails --prefix mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix mcp
      - run: npm run build --prefix mcp
      - name: Run validation
        run: ${{ matrix.command }}

  mcp-container:
    name: MCP container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f mcp/Dockerfile -t generative-arcana-mcp:test .

  vercel:
    name: Vercel container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f Dockerfile.vercel -t generative-arcana-vercel:test .

  migration-workflow:
    name: Versioned migration safety and PostgreSQL concurrency
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arcana_ci
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: arcana_migration_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node tools/check-migration-history.mjs
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      - run: npm ci --prefix mcp
      - run: npm run db:domain:catalog:check --prefix mcp
      - run: npm run test:migration-runner --prefix mcp
      - run: npm run test:migration-concurrency --prefix mcp
        env:
          ARCANA_DISPOSABLE_POSTGRES: '1'

  migration-native-transport:
    name: Native libpq TLS and PostgreSQL17 migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --prefix mcp --ignore-scripts
      - name: Prepare pinned migration client
        shell: bash
        run: |
          python3.12 -m venv "$RUNNER_TEMP/arcana-migration-python"
          "$RUNNER_TEMP/arcana-migration-python/bin/python" -m pip install --require-hashes --only-binary=:all: -r mcp/scripts/libpq/requirements.txt
          echo "MIGRATION_PYTHON=$RUNNER_TEMP/arcana-migration-python/bin/python" >> "$GITHUB_ENV"
      - run: bash mcp/test/run-libpq-docker-fixture.sh
