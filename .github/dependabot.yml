version: 2
updates:
  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      better-auth:
        patterns: ['better-auth', '@better-auth/*']
        update-types: ['minor', 'patch']
      better-auth-major:
        patterns: ['better-auth', '@better-auth/*']
        update-types: ['major']
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    # Coupled peers move together; major migrations remain separate review units.
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: ['minor', 'patch']
      react-major:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: ['major']
      vite:
        patterns: ['vite', '@vitejs/plugin-react']
        update-types: ['minor', 'patch']
      vite-major:
        patterns: ['vite', '@vitejs/plugin-react']
        update-types: ['major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
